
[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# BLE001 (except Exception) — в UI-слое допустим: обработчик пишет ошибку в лог
#   (log_except) и показывает пользователю Snackbar; глотания без логирования
#   вычищены вручную.
# B008 — ft.Colors.PRIMARY / ft.Icons.* в значениях по умолчанию аргументов
#   конструктора страниц это идиоматичный стиль Flet, а не mutable default bug.
# RUF012 — атрибуты классов-страниц это конфигурация виджетов, мутация не планируется.
ignore = ["BLE001", "B008", "RUF012"]
